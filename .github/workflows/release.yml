name: release

# Triggered by `v*` tags (push one with `make release`). The test job runs the
# test suite without access to any secret. The publish job then extracts the
# matching section from docs/release-notes.md, publishes the package to PyPI
# and publishes the notes as the GitHub Release body. Re-runs idempotently
# update an existing release rather than failing.
#
# The package is published with PyPI trusted publishing: PyPI accepts a short
# lived OIDC token issued to the publish job of this workflow, running in the
# `pypi` environment, so no PyPI secret is stored in the repository.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_ENV: ci
      FLUID_FLAMEGRAPH_EXECUTABLE: "./flamegraph.pl"
      UV_LOCKED: "1"

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups
      - name: Install flamegraph
        env:
          FG_PATH: "."
        run: ./.dev/install-flamegraph
      - name: run lint
        run: make lint-test
      - name: build docs
        run: make docs
      - name: tests
        run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="## ${TAG}" '
            $0 == tag { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' docs/release-notes.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No section '## ${TAG}' found in docs/release-notes.md" >&2
            exit 1
          fi
          echo "--- extracted notes for ${TAG} ---"
          cat /tmp/notes.md
      - name: build package
        run: uv build
      - name: publish to PyPI
        run: uv publish --trusted-publishing always
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
