name: build

on:
  push:
    tags-ignore:
      - '**'
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_ENV: ci
      FLUID_FLAMEGRAPH_EXECUTABLE: "./flamegraph.pl"
      UV_LOCKED: "1"
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups
      - name: Install flamegraph
        env:
          FG_PATH: "."
        run: ./.dev/install-flamegraph
      - name: run lint
        run: make lint-test
      - name: build docs
        run: make docs
      - name: tests
        run: make test
      - name: upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.xml

  publish-docs:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      UV_LOCKED: "1"
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups
      - name: fetch gh-pages
        run: git fetch origin gh-pages:gh-pages
      - name: publish-docs
        run: make docs-publish
