site_name: Aio Fluid
site_url: https://fluid.quantmind.com
repo_name: quantmind/aio-fluid
repo_url: https://github.com/quantmind/aio-fluid
strict: true
nav:
- Home: index.md
- recipes.md
- Reference:
  - reference/index.md
  - reference/db.md
  - reference/db_cli.md
  - reference/db_crud.md
  - reference/db_migrations.md
  - reference/db_pagination.md
  - reference/dispatchers.md
  - reference/errors.md
  - reference/http_client.md
  - reference/task.md
  - reference/task_broker.md
  - reference/task_cli.md
  - reference/task_consumer.md
  - reference/task_manager.md
  - reference/task_plugin.md
  - reference/task_registry.md
  - reference/task_retry.md
  - reference/task_run.md
  - reference/task_scheduler.md
  - reference/task_scheduling.md
  - reference/utils.md
  - reference/workers.md
- Tutorials:
  - tutorials/index.md
  - tutorials/db.md
  - tutorials/dispatchers.md
  - tutorials/task_app.md
  - tutorials/task_broker.md
  - tutorials/task_deps.md
  - tutorials/task_fastapi.md
  - tutorials/task_k8s.md
  - tutorials/task_managers.md
  - tutorials/task_retry.md
  - tutorials/tasks.md
  - tutorials/workers.md
- ai-agents.md
- comparison.md
- release-notes.md
theme:
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb-outline
      name: Switch to light mode
  features:
    - navigation.instant
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - content.code.copy
  logo: assets/fluid-logo-dark.svg
hooks:
  - .dev/docs.py
plugins:
- search
- redirects:
    redirect_maps:
      tutorials/task_queue.md: tutorials/tasks.md
- llmstxt:
    markdown_description: >-
      An async task queue for Python backend services. Tasks are async functions
      declared with a decorator, scheduled with every() or crontab(), and run
      concurrently on asyncio. A task marked cpu_bound runs in a subprocess, or as
      a Kubernetes Job in a cluster, so heavy work never blocks the event loop.
    full_output: llms-full.txt
    sections:
      Getting started:
      - index.md: Why the library exists, installation, and a complete example application.
      - recipes.md: Cheat sheet of the canonical patterns, and the mistakes to avoid.
      - ai-agents.md: How to point a coding agent at this documentation.
      Tutorials:
      - tutorials/tasks.md: Declare tasks, parameters, schedules, timeouts, concurrency, chaining and aborts.
      - tutorials/task_managers.md: Choose between TaskManager, TaskConsumer and TaskScheduler.
      - tutorials/task_app.md: Wire tasks into a producer/consumer application, the CLI entry point and plugins.
      - tutorials/task_deps.md: Share a database manager, an HTTP client or any other resource across task runs.
      - tutorials/task_fastapi.md: Add your own routes to the task manager app and inject the same dependencies.
      - tutorials/task_retry.md: Retry on failure and when rate limited by concurrency limits.
      - tutorials/task_k8s.md: Dispatch CPU bound tasks as Kubernetes Jobs.
      - tutorials/task_broker.md: Replace the default Redis broker.
      - tutorials/workers.md: The async worker lifecycle the task queue is built on.
      - tutorials/db.md: Async Postgres CRUD and migrations.
      - tutorials/dispatchers.md: Sync and async event dispatchers.
      API reference:
      - reference/*.md
      Background:
      - comparison.md: How the library compares to Celery, RQ, arq and taskiq.
      - release-notes.md: Changes in each release.
- mkdocstrings:
    handlers:
      python:
        options:
          show_root_heading: true
          show_if_no_docstring: true
          inherited_members: true
          members_order: source
          separate_signature: true
          unwrap_annotated: true
          filters:
          - '!^_'
          merge_init_into_class: true
          docstring_section_style: spacy
          signature_crossrefs: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          extensions:
          - griffe_typingdoc
          - griffe_pydantic:
              schema: false
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
